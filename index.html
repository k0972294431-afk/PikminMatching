<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皮克敏對對碰</title>
  <style>
    :root {
      --forest-1: #f7f3dc;
      --forest-2: #dff3c8;
      --forest-3: #8bcf6a;
      --forest-4: #4e8f3f;
      --panel: rgba(255, 255, 255, 0.9);
      --text: #2e4a1f;
      --shadow: rgba(48, 86, 34, 0.26);
      --card-radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 15%, rgba(255, 248, 203, 0.8) 0, transparent 35%),
        radial-gradient(circle at 15% 80%, rgba(175, 228, 140, 0.55) 0, transparent 40%),
        linear-gradient(180deg, var(--forest-1) 0%, var(--forest-2) 40%, var(--forest-3) 100%);
    }

    .app {
      width: min(980px, 94vw);
      margin: 24px auto 32px;
    }

    .top-panel {
      background: var(--panel);
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 18px;
      box-shadow: 0 8px 22px var(--shadow);
      padding: 16px 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .title {
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 1rem;
      font-weight: 700;
    }

    .badge {
      background: linear-gradient(180deg, #eefadf, #d6efbf);
      border: 1px solid #9eca77;
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .sound-toggle {
      border: 1px solid #9eca77;
      border-radius: 999px;
      padding: 6px 14px;
      background: linear-gradient(180deg, #fff7d6, #f3de9b);
      color: #355928;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .sound-toggle:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .sound-toggle.is-muted {
      background: linear-gradient(180deg, #ececec, #d4d4d4);
      color: #666;
    }

    .hint {
      font-size: 0.92rem;
      opacity: 0.85;
      margin-top: 10px;
    }

    .board-wrap {
      perspective: 1200px;
      background: rgba(255, 255, 255, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 20px;
      box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.35), 0 10px 30px var(--shadow);
      padding: 12px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      border: none;
      position: relative;
      cursor: pointer;
      aspect-ratio: 330 / 450;
      border-radius: var(--card-radius);
      transform-style: preserve-3d;
      transform-origin: center;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      box-shadow: 0 6px 14px rgba(35, 77, 28, 0.25);
    }

    .card.flipped,
    .card.matched {
      transform: rotateY(180deg);
      cursor: default;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: var(--card-radius);
      backface-visibility: hidden;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.55);
    }

    .front {
      transform: rotateY(180deg);
      background: #ffffff;
    }

    .front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .back {
      background-image: url("images/card.jpg");
      background-size: cover;
      background-position: center;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .restart {
      border: none;
      background: linear-gradient(180deg, #90d874, #5cad44);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.02em;
      border-radius: 12px;
      padding: 10px 24px;
      cursor: pointer;
      box-shadow: 0 4px 0 #3e7f2f;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    .restart:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .restart:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3e7f2f;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(23, 42, 15, 0.6);
      z-index: 10;
      padding: 18px;
      overflow: hidden;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-box {
      position: relative;
      z-index: 2;
      width: min(620px, 94vw);
      background: linear-gradient(180deg, #fffef6, #f0fbe6);
      border: 2px solid #e2f1d1;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.24);
      padding: 28px 22px;
      text-align: center;
      animation: pop 0.28s ease-out;
    }

    .overlay-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 10px;
      color: #3a6f2d;
    }

    .overlay-text {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #4b6e33;
    }

    .result-poster {
      width: min(330px, 78vw);
      aspect-ratio: 4 / 3;
      margin: 10px auto 14px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 25px rgba(56, 84, 40, 0.25);
      background: #fff;
    }

    .result-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .result-stats {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 10px;
      color: #365f28;
      font-weight: 700;
    }

    .result-encourage {
      margin: 0 auto 20px;
      max-width: 500px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #4b6e33;
    }

    .fireworks-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    /* ========== 首頁：暱稱輸入 ========== */
    .start-screen {
      width: min(560px, 94vw);
      margin: 48px auto;
      background: var(--panel);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      box-shadow: 0 12px 32px var(--shadow);
      padding: 28px 24px;
      text-align: center;
    }

    .start-screen .title {
      margin-bottom: 18px;
    }

    .nickname-label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: left;
    }

    .nickname-input {
      width: 100%;
      border: 2px solid #b9d89f;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      margin-bottom: 16px;
      color: var(--text);
      background: #fff;
    }

    .nickname-input:focus {
      border-color: #6fbf3a;
      box-shadow: 0 0 0 3px rgba(111, 191, 58, 0.25);
    }

    .start-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #90d874, #5cad44);
      box-shadow: 0 4px 0 #3e7f2f;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease, opacity 0.14s ease;
    }

    .start-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .start-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      background: linear-gradient(180deg, #b5c9a8, #95ad88);
    }

    .loot-status {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #5a7a45;
      min-height: 1.2em;
    }

    .start-leaderboard-wrap {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed #c5e1a5;
    }

    /* ========== 世界排行榜表格 ========== */
    .leaderboard-wrap {
      margin: 14px 0 18px;
      text-align: left;
    }

    .leaderboard-title {
      font-size: 1rem;
      font-weight: 800;
      color: #3a6f2d;
      margin-bottom: 8px;
      text-align: center;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 12px;
      overflow: hidden;
    }

    .leaderboard-table th,
    .leaderboard-table td {
      padding: 8px 6px;
      border-bottom: 1px solid #dcefd0;
      text-align: center;
    }

    .leaderboard-table th {
      background: #e8f5e0;
      color: #355928;
      font-weight: 800;
    }

    .leaderboard-table tr:last-child td {
      border-bottom: none;
    }

    .leaderboard-table .col-name {
      text-align: left;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leaderboard-loading,
    .leaderboard-error {
      text-align: center;
      font-size: 0.85rem;
      color: #5a7a45;
      padding: 8px;
    }

    .leaderboard-warning {
      text-align: center;
      font-size: 0.82rem;
      color: #8a5a12;
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .overlay-box {
      max-height: 92vh;
      overflow-y: auto;
    }

    @media (max-width: 600px) {
      .app {
        width: min(100%, 96vw);
        margin: 14px auto 22px;
      }

      .top-panel {
        padding: 14px 12px;
      }

      .title {
        font-size: 1.25rem;
      }

      .board-wrap {
        padding: 8px;
      }

      .board {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .card {
        width: 100%;
        max-width: 70px;
        justify-self: center;
      }

      .controls {
        margin-top: 12px;
      }

      .restart {
        width: 88%;
      }

      .start-screen {
        margin: 20px auto;
        padding: 22px 16px;
      }

      .leaderboard-table {
        font-size: 0.72rem;
      }

      .leaderboard-table th,
      .leaderboard-table td {
        padding: 6px 4px;
      }
    }

    @keyframes pop {
      from {
        transform: scale(0.92);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <!-- 首頁：暱稱輸入與開始遊戲 -->
  <section class="start-screen" id="startScreen">
    <h1 class="title">🌿 皮克敏對對碰</h1>
    <label class="nickname-label" for="nicknameInput">請輸入暱稱</label>
    <input
      class="nickname-input"
      id="nicknameInput"
      type="text"
      maxlength="20"
      placeholder="例如：小隊長阿明"
      autocomplete="nickname"
    />
    <button class="start-btn" id="startGameBtn" type="button" disabled>開始遊戲</button>
    <p class="loot-status" id="lootStatus" aria-live="polite"></p>

    <div class="leaderboard-wrap start-leaderboard-wrap">
      <h3 class="leaderboard-title">🏆TOP 10</h3>
      <div id="homeLeaderboardContainer">
        <p class="leaderboard-loading">排行榜載入中…</p>
      </div>
    </div>
  </section>

  <main class="app hidden" id="gameScreen">
    <section class="top-panel">
      <h1 class="title">🌿 皮克敏對對碰</h1>
      <div class="stats">
        <span class="badge">配對次數：<span id="matchCount">0</span> / 8</span>
        <span class="badge">通關計時：<span id="timerText">0 秒</span></span>
        <button class="sound-toggle" id="soundToggleBtn" type="button" aria-pressed="false">🔊 開聲</button>
      </div>
      <p class="hint">翻開兩張相同皮克敏即可配對成功，全部找齊就完成收集！</p>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="4x4 皮克敏對對碰棋盤"></div>
    </section>

    <div class="controls">
      <button class="restart" id="restartBtn" type="button">重新開始</button>
    </div>
  </main>

  <section class="overlay" id="overlay" aria-modal="true" role="dialog">
    <canvas class="fireworks-canvas" id="fireworksCanvas"></canvas>
    <div class="overlay-box">
      <h2 class="overlay-title">🎉 恭喜！皮克敏順利收集完畢！🎉</h2>
      <p class="overlay-text">全員集合，合作精神滿分！</p>
      <div class="result-poster">
        <img src="images/All Pikmins images.png" alt="皮克敏全家福" />
      </div>
      <div class="result-stats">
        <div id="finalTime">本次通關時間：0 秒</div>
        <div id="finalMatchCount">配對次數：0</div>
      </div>
      <p class="result-encourage">真是不容易，但是你成功了！</p>

      <div class="leaderboard-wrap">
        <h3 class="leaderboard-title">🏆TOP 10</h3>
        <div id="leaderboardContainer">
          <p class="leaderboard-loading">排行榜載入中…</p>
        </div>
      </div>

      <button class="restart" id="overlayRestartBtn" type="button">再玩一局</button>
    </div>
  </section>

  <script>
    /*
     * 皮克敏對對碰（輕鬆收集模式 + LootLocker 世界排行榜）
     * - 4x4 網格，共 16 張卡（8 對）
     * - 首頁輸入暱稱後 Guest Login，通關自動上傳秒數
     * - 結算畫面顯示 TOP 10 排行榜
     */

    // ========== LootLocker 連線設定 ==========
    const LOOTLOCKER_API = "https://icugyo9j.api.lootlocker.io";
    const LOOTLOCKER_DOMAIN_KEY = "icugyo9j";
    const GAME_API_KEY = "dev_f3693ad2ff7a4a9a97b6e32d4ef6f7c9";
    const LEADERBOARD_KEY = "pikmin_matching_leaderboard";
    const GAME_VERSION = "1.0.0.0";
    const STORAGE_NICKNAME = "pikmin_player_nickname";
    const STORAGE_PLAYER_ID = "pikmin_lootlocker_player_identifier";

    // 8 種皮克敏圖片設定（依指定檔名）
    const PIKMIN = [
      { id: "red", image: "images/red.png" },
      { id: "yellow", image: "images/yellow.png" },
      { id: "blue", image: "images/blue.png" },
      { id: "purple", image: "images/purple.png" },
      { id: "white", image: "images/white.png" },
      { id: "rock", image: "images/rock.png" },
      { id: "pinkwing", image: "images/pinkwing.png" },
      { id: "iceblue", image: "images/iceblue.png" }
    ];

    const CARD_BACK_IMAGE = "images/card.jpg";
    const ALL_PIKMINS_IMAGE = "images/All Pikmins images.png";
    const TOTAL_PAIRS = 8;

    const preloadList = [
      ...PIKMIN.map((p) => p.image),
      CARD_BACK_IMAGE,
      ALL_PIKMINS_IMAGE
    ];

    // 預先載入所有遊戲圖片，降低首次翻牌延遲
    function preloadImages(urls) {
      return Promise.all(
        urls.map(
          (url) =>
            new Promise((resolve) => {
              const img = new Image();
              img.onload = resolve;
              img.onerror = resolve;
              img.src = url;
            })
        )
      );
    }

    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const nicknameInput = document.getElementById("nicknameInput");
    const startGameBtn = document.getElementById("startGameBtn");
    const lootStatusEl = document.getElementById("lootStatus");
    const boardEl = document.getElementById("board");
    const matchCountEl = document.getElementById("matchCount");
    const timerTextEl = document.getElementById("timerText");
    const soundToggleBtn = document.getElementById("soundToggleBtn");
    const restartBtn = document.getElementById("restartBtn");
    const overlay = document.getElementById("overlay");
    const overlayRestartBtn = document.getElementById("overlayRestartBtn");
    const finalTimeEl = document.getElementById("finalTime");
    const finalMatchCountEl = document.getElementById("finalMatchCount");
    const fireworksCanvas = document.getElementById("fireworksCanvas");
    const homeLeaderboardContainer = document.getElementById("homeLeaderboardContainer");
    const leaderboardContainer = document.getElementById("leaderboardContainer");

    let deck = [];
    let opened = [];
    let lockBoard = false;
    let matchedPairs = 0;
    let gameStartedAt = 0;
    let timerIntervalId = null;
    let elapsedSeconds = 0;
    let isMuted = false;
    let audioCtx = null;
    let fireworksRafId = null;
    let fireworksParticles = [];
    let playerNickname = "";
    let sessionToken = null;
    let sessionReadyPromise = null;

    // ========== LootLocker API 工具 ==========

    /** 建立 LootLocker 標準 Headers（含 ll-api-key / ll-data-domain） */
    function buildLootLockerHeaders(extraHeaders = {}, includeSession = true) {
      const headers = {
        "Content-Type": "application/json",
        "ll-api-key": GAME_API_KEY,
        "ll-data-domain": LOOTLOCKER_DOMAIN_KEY,
        ...extraHeaders
      };
      if (includeSession && sessionToken) {
        headers["x-session-token"] = sessionToken;
      }
      return headers;
    }

    /** 從回應中擷取可讀錯誤訊息 */
    function getLootLockerErrorMessage(data, fallback) {
      if (!data) return fallback;
      if (typeof data.message === "string" && data.message) return data.message;
      if (typeof data.error === "string" && data.error) return data.error;
      if (data.errorData?.message) return data.errorData.message;
      return fallback;
    }

    /** 通用 fetch 封裝 */
    async function lootLockerRequest(path, options = {}) {
      const includeSession = options.includeSession !== false;
      const method = (options.method || "GET").toUpperCase();
      const headers = buildLootLockerHeaders(options.headers || {}, includeSession);

      const fetchOptions = {
        method,
        headers
      };

      if (options.body !== undefined && method !== "GET" && method !== "HEAD") {
        fetchOptions.body = options.body;
      }

      const response = await fetch(`${LOOTLOCKER_API}${path}`, fetchOptions);

      let data = null;
      const rawText = await response.text();
      if (rawText) {
        try {
          data = JSON.parse(rawText);
        } catch {
          data = { message: rawText };
        }
      } else {
        data = {};
      }

      if (!response.ok) {
        throw new Error(getLootLockerErrorMessage(data, `HTTP ${response.status}`));
      }
      if (Object.prototype.hasOwnProperty.call(data, "success") && data.success === false) {
        throw new Error(getLootLockerErrorMessage(data, "LootLocker API 失敗"));
      }
      return data;
    }

    /** Guest Session：訪客登入（Web 平台）並設定玩家暱稱 */
    async function initGuestSession(nickname) {
      const storedIdentifier = localStorage.getItem(STORAGE_PLAYER_ID);
      const body = {
        game_key: GAME_API_KEY,
        game_version: GAME_VERSION,
        platform: "web",
        optionals: {
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"
        }
      };
      if (nickname) body.optionals.player_name = nickname;
      if (storedIdentifier) body.player_identifier = storedIdentifier;

      const data = await lootLockerRequest("/game/v2/session/guest", {
        method: "POST",
        includeSession: false,
        body: JSON.stringify(body)
      });

      if (!data.session_token) {
        throw new Error("Guest Session 未取得 session_token");
      }

      sessionToken = data.session_token;
      localStorage.setItem(STORAGE_PLAYER_ID, data.player_identifier);

      if (nickname) {
        localStorage.setItem(STORAGE_NICKNAME, nickname);
        if (!data.player_name || data.player_name !== nickname) {
          await setPlayerName(nickname);
        }
      }
      return data;
    }

    /** 確保已有有效 session（登入失敗時可於通關前重試） */
    async function ensureLootLockerSession() {
      if (sessionToken) return;
      if (!playerNickname) {
        throw new Error("尚未設定玩家暱稱");
      }
      await initGuestSession(playerNickname);
    }

    /** 設定 LootLocker Player Name */
    async function setPlayerName(name) {
      await lootLockerRequest("/game/player/name", {
        method: "PATCH",
        headers: { "LL-Version": "2021-03-01" },
        body: JSON.stringify({ name })
      });
    }

    /** 上傳通關秒數（score 必須為整數秒；metadata 為 ISO 時間戳記） */
    async function submitLeaderboardScore(scoreSeconds) {
      const completedAt = new Date().toISOString();
      const score = Math.max(0, Math.floor(Number(scoreSeconds) || 0));
      await lootLockerRequest(`/game/leaderboards/${LEADERBOARD_KEY}/submit`, {
        method: "POST",
        body: JSON.stringify({
          score,
          metadata: completedAt
        })
      });
    }

    /** 取得排行榜前 N 名 */
    async function fetchLeaderboardTop(count = 10) {
      const data = await lootLockerRequest(
        `/game/leaderboards/${encodeURIComponent(LEADERBOARD_KEY)}/list?count=${count}&after=0`,
        { method: "GET" }
      );
      return Array.isArray(data.items) ? data.items : [];
    }

    /** 將 LootLocker metadata 時間戳記格式化為 YYYY-MM-DD */
    function formatLeaderboardDate(metadata) {
      if (!metadata) return "—";
      const parsed = new Date(metadata);
      if (Number.isNaN(parsed.getTime())) {
        const match = String(metadata).match(/(\d{4}-\d{2}-\d{2})/);
        return match ? match[1] : "—";
      }
      const y = parsed.getFullYear();
      const m = String(parsed.getMonth() + 1).padStart(2, "0");
      const d = String(parsed.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    /** 渲染排行榜到指定容器（首頁預覽 / 結算畫面共用） */
    function renderLeaderboardTable(container, items, uploadWarning = "") {
      if (!container) return;

      const warningHtml = uploadWarning
        ? `<p class="leaderboard-warning">⚠️ ${uploadWarning}</p>`
        : "";

      if (!items.length) {
        container.innerHTML =
          warningHtml +
          '<p class="leaderboard-loading">尚無排行資料，快來搶第一！</p>';
        return;
      }

      const rows = items
        .map((item) => {
          const name = item.player?.name || "匿名探險家";
          const scoreText = formatDuration(item.score);
          const dateText = formatLeaderboardDate(item.metadata);
          const safeName = name.replace(/"/g, "&quot;");
          return `
            <tr>
              <td>${item.rank}</td>
              <td class="col-name" title="${safeName}">${name}</td>
              <td>${scoreText}</td>
              <td>${dateText}</td>
            </tr>
          `;
        })
        .join("");

      container.innerHTML = `${warningHtml}
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>排名</th>
              <th>玩家暱稱</th>
              <th>通關秒數</th>
              <th>完成日期</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function renderLeaderboardLoading(container) {
      if (!container) return;
      container.innerHTML = '<p class="leaderboard-loading">排行榜載入中…</p>';
    }

    function renderLeaderboardError(container, message) {
      if (!container) return;
      container.innerHTML = `<p class="leaderboard-error">${message || "排行榜暫時無法載入"}</p>`;
    }

    /** 確保可讀取排行榜的 Guest Session（首頁預覽用，暱稱可選） */
    async function ensureLeaderboardReadSession() {
      if (sessionToken) return;
      const savedNickname = localStorage.getItem(STORAGE_NICKNAME);
      await initGuestSession(savedNickname || null);
    }

    /** 首頁載入時：預先抓取並顯示 TOP 10 */
    async function loadHomeLeaderboardPreview() {
      renderLeaderboardLoading(homeLeaderboardContainer);
      try {
        await ensureLeaderboardReadSession();
        const items = await fetchLeaderboardTop(10);
        renderLeaderboardTable(homeLeaderboardContainer, items);
      } catch (error) {
        console.warn("Home leaderboard preview error:", error);
        renderLeaderboardError(homeLeaderboardContainer, "排行榜暫時無法載入");
      }
    }

    /** 通關後：上傳分數並刷新 TOP 10（上傳失敗仍嘗試顯示排行榜） */
    async function handleLeaderboardAfterWin() {
      renderLeaderboardLoading(leaderboardContainer);
      let uploadWarning = "";

      try {
        if (sessionReadyPromise) {
          try {
            await sessionReadyPromise;
          } catch (loginError) {
            console.warn("LootLocker login retry:", loginError);
          }
        }
        await ensureLootLockerSession();

        try {
          await submitLeaderboardScore(elapsedSeconds);
        } catch (submitError) {
          console.warn("LootLocker submit error:", submitError);
          const msg = submitError.message || "分數上傳失敗";
          uploadWarning =
            msg.includes("game writes")
              ? "分數上傳失敗：請到 LootLocker 後台開啟此排行榜的「Enable Game API writes」。"
              : `分數上傳失敗：${msg}`;
        }

        const items = await fetchLeaderboardTop(10);
        renderLeaderboardTable(leaderboardContainer, items, uploadWarning);
      } catch (error) {
        console.warn("LootLocker leaderboard error:", error);
        renderLeaderboardError(
          leaderboardContainer,
          `排行榜暫時無法載入：${error.message || "請稍後再試"}`
        );
      }
    }

    // 輕量音效：使用 Web Audio API 產生翻牌、成功與通關提示音
    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function playTone(freq, duration, type = "sine", volume = 0.03, startDelay = 0) {
      if (!audioCtx || isMuted) return;
      const now = audioCtx.currentTime + startDelay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playFlipSound() {
      playTone(680, 0.08, "triangle", 0.02);
    }

    function playMatchSound() {
      playTone(660, 0.09, "sine", 0.03);
      playTone(990, 0.14, "sine", 0.03, 0.08);
    }

    function playWinSound() {
      playTone(523, 0.14, "triangle", 0.04);
      playTone(659, 0.14, "triangle", 0.04, 0.12);
      playTone(784, 0.18, "triangle", 0.045, 0.24);
      playTone(1046, 0.24, "triangle", 0.05, 0.38);
    }

    function updateSoundToggleUI() {
      soundToggleBtn.textContent = isMuted ? "🔇 靜音" : "🔊 開聲";
      soundToggleBtn.classList.toggle("is-muted", isMuted);
      soundToggleBtn.setAttribute("aria-pressed", String(isMuted));
    }

    function launchFireworkBurst(x, y) {
      const colors = ["#ffd54f", "#ff8a65", "#ffecb3", "#81c784", "#90caf9", "#f48fb1"];
      const amount = 24;
      for (let i = 0; i < amount; i++) {
        const angle = (Math.PI * 2 * i) / amount;
        const speed = 1.6 + Math.random() * 2.4;
        fireworksParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 40 + Math.random() * 30,
          size: 2 + Math.random() * 3,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function startFireworks() {
      stopFireworks();
      const ctx = fireworksCanvas.getContext("2d");
      if (!ctx) return;

      const resizeCanvas = () => {
        fireworksCanvas.width = overlay.clientWidth;
        fireworksCanvas.height = overlay.clientHeight;
      };
      resizeCanvas();

      let frameCount = 0;
      const animate = () => {
        frameCount += 1;
        ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

        if (frameCount % 16 === 0) {
          const x = 60 + Math.random() * (fireworksCanvas.width - 120);
          const y = 70 + Math.random() * (fireworksCanvas.height * 0.45);
          launchFireworkBurst(x, y);
        }

        fireworksParticles = fireworksParticles.filter((p) => p.life > 0);
        fireworksParticles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.03;
          p.vx *= 0.995;
          p.life -= 1;
          const alpha = Math.max(0, p.life / 70);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        fireworksRafId = requestAnimationFrame(animate);
      };
      fireworksRafId = requestAnimationFrame(animate);
      window.addEventListener("resize", resizeCanvas, { passive: true });
      fireworksCanvas._resizeCanvasHandler = resizeCanvas;
    }

    function stopFireworks() {
      if (fireworksRafId) {
        cancelAnimationFrame(fireworksRafId);
        fireworksRafId = null;
      }
      const handler = fireworksCanvas._resizeCanvasHandler;
      if (handler) {
        window.removeEventListener("resize", handler);
        fireworksCanvas._resizeCanvasHandler = null;
      }
      const ctx = fireworksCanvas.getContext("2d");
      if (ctx) ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      fireworksParticles = [];
    }

    // Fisher-Yates 洗牌
    function shuffle(arr) {
      const list = [...arr];
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    // 產生 16 張卡片資料（每個 id 各兩張）
    function createDeck() {
      const duplicated = [];
      PIKMIN.forEach((p) => {
        duplicated.push({ key: p.id, image: p.image });
        duplicated.push({ key: p.id, image: p.image });
      });
      return shuffle(duplicated);
    }

    // 建立棋盤 DOM
    function renderBoard() {
      boardEl.innerHTML = "";
      deck.forEach((card, index) => {
        const cardEl = document.createElement("button");
        cardEl.type = "button";
        cardEl.className = "card";
        cardEl.dataset.index = String(index);
        cardEl.setAttribute("aria-label", "對對碰卡片");

        const back = document.createElement("div");
        back.className = "face back";

        const front = document.createElement("div");
        front.className = "face front";
        const img = document.createElement("img");
        img.src = card.image;
        img.alt = card.key;
        front.appendChild(img);

        cardEl.appendChild(back);
        cardEl.appendChild(front);

        cardEl.addEventListener("click", () => onCardClick(index));
        boardEl.appendChild(cardEl);
      });
    }

    function updateStats() {
      matchCountEl.textContent = String(matchedPairs);
      timerTextEl.textContent = formatDuration(elapsedSeconds);
    }

    function formatDuration(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      if (mins <= 0) return `${secs} 秒`;
      return `${mins} 分 ${secs} 秒`;
    }

    function startTimer() {
      stopTimer();
      gameStartedAt = Date.now();
      elapsedSeconds = 0;
      updateStats();
      timerIntervalId = setInterval(() => {
        elapsedSeconds = Math.floor((Date.now() - gameStartedAt) / 1000);
        timerTextEl.textContent = formatDuration(elapsedSeconds);
      }, 250);
    }

    function stopTimer() {
      if (timerIntervalId) {
        clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
    }

    function showOverlay() {
      overlay.classList.add("show");
      startFireworks();
      playWinSound();
      handleLeaderboardAfterWin();
    }

    function hideOverlay() {
      overlay.classList.remove("show");
      stopFireworks();
    }

    function onCardClick(index) {
      if (lockBoard) return;

      const cardEl = boardEl.children[index];
      if (!cardEl) return;

      // 已配對或已翻開的卡片不可再操作
      if (cardEl.classList.contains("matched") || cardEl.classList.contains("flipped")) return;

      ensureAudioContext();
      playFlipSound();
      cardEl.classList.add("flipped");
      opened.push(index);

      // 只有翻開 2 張時才進行比對
      if (opened.length < 2) return;

      lockBoard = true;
      const [a, b] = opened;
      const isMatch = deck[a].key === deck[b].key;

      if (isMatch) {
        playMatchSound();
        boardEl.children[a].classList.add("matched");
        boardEl.children[b].classList.add("matched");
        matchedPairs += 1;
        updateStats();
        opened = [];
        lockBoard = false;

        // 8 對都完成時顯示慶祝視窗
        if (matchedPairs === TOTAL_PAIRS) {
          stopTimer();
          finalTimeEl.textContent = `本次通關時間：${formatDuration(elapsedSeconds)}`;
          finalMatchCountEl.textContent = `配對次數：${matchedPairs} / ${TOTAL_PAIRS}`;
          showOverlay();
        }
        return;
      }

      // 配對失敗：延遲後翻回去，保留流暢視覺
      setTimeout(() => {
        boardEl.children[a].classList.remove("flipped");
        boardEl.children[b].classList.remove("flipped");
        opened = [];
        lockBoard = false;
      }, 700);
    }

    // 重開一局（保留 LootLocker session，不重登）
    function startGame() {
      hideOverlay();
      deck = createDeck();
      opened = [];
      lockBoard = false;
      matchedPairs = 0;
      elapsedSeconds = 0;
      updateStats();
      renderBoard();
      startTimer();
    }

    function updateStartButtonState() {
      const hasName = nicknameInput.value.trim().length > 0;
      startGameBtn.disabled = !hasName;
    }

    function showGameScreen() {
      startScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
    }

  /** 點擊【開始遊戲】：記住暱稱、Guest Login、進入棋盤 */
    function onClickStartGame() {
      const nickname = nicknameInput.value.trim();
      if (!nickname) return;

      playerNickname = nickname;
      localStorage.setItem(STORAGE_NICKNAME, nickname);
      startGameBtn.disabled = true;
      lootStatusEl.textContent = "正在連線世界排行榜…";

      sessionReadyPromise = initGuestSession(nickname)
        .then(() => {
          lootStatusEl.textContent = "已連線世界排行榜 ✓";
        })
        .catch((error) => {
          sessionToken = null;
          console.warn("LootLocker guest login failed:", error);
          lootStatusEl.textContent = `連線失敗：${error.message || "請稍後再試"}（仍可遊玩）`;
          throw error;
        })
        .finally(() => {
          startGameBtn.disabled = false;
        });

      showGameScreen();
      startGame();
    }

    restartBtn.addEventListener("click", startGame);
    overlayRestartBtn.addEventListener("click", startGame);
    soundToggleBtn.addEventListener("click", () => {
      ensureAudioContext();
      isMuted = !isMuted;
      updateSoundToggleUI();
    });

    nicknameInput.addEventListener("input", updateStartButtonState);
    startGameBtn.addEventListener("click", onClickStartGame);
    nicknameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !startGameBtn.disabled) onClickStartGame();
    });

    // 初次載入：預載圖片、還原暱稱、首頁預覽排行榜
    function initApp() {
      const savedNickname = localStorage.getItem(STORAGE_NICKNAME);
      if (savedNickname) {
        nicknameInput.value = savedNickname;
      }
      updateStartButtonState();
      updateSoundToggleUI();
      preloadImages(preloadList);
      loadHomeLeaderboardPreview();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
