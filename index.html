<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皮克敏對對碰</title>
  <style>
    :root {
      --forest-1: #f7f3dc;
      --forest-2: #dff3c8;
      --forest-3: #8bcf6a;
      --forest-4: #4e8f3f;
      --panel: rgba(255, 255, 255, 0.9);
      --text: #2e4a1f;
      --shadow: rgba(48, 86, 34, 0.26);
      --card-radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 15%, rgba(255, 248, 203, 0.8) 0, transparent 35%),
        radial-gradient(circle at 15% 80%, rgba(175, 228, 140, 0.55) 0, transparent 40%),
        linear-gradient(180deg, var(--forest-1) 0%, var(--forest-2) 40%, var(--forest-3) 100%);
    }

    .app {
      width: min(980px, 94vw);
      margin: 24px auto 32px;
    }

    .top-panel {
      background: var(--panel);
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 18px;
      box-shadow: 0 8px 22px var(--shadow);
      padding: 16px 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .title {
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 1rem;
      font-weight: 700;
    }

    .badge {
      background: linear-gradient(180deg, #eefadf, #d6efbf);
      border: 1px solid #9eca77;
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .sound-toggle {
      border: 1px solid #9eca77;
      border-radius: 999px;
      padding: 6px 14px;
      background: linear-gradient(180deg, #fff7d6, #f3de9b);
      color: #355928;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .sound-toggle:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .sound-toggle.is-muted {
      background: linear-gradient(180deg, #ececec, #d4d4d4);
      color: #666;
    }

    .hint {
      font-size: 0.92rem;
      opacity: 0.85;
      margin-top: 10px;
    }

    .board-wrap {
      perspective: 1200px;
      background: rgba(255, 255, 255, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 20px;
      box-shadow: inset 0 2px 10px rgba(255, 255, 255, 0.35), 0 10px 30px var(--shadow);
      padding: 12px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      border: none;
      position: relative;
      cursor: pointer;
      aspect-ratio: 330 / 450;
      border-radius: var(--card-radius);
      transform-style: preserve-3d;
      transform-origin: center;
      transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
      box-shadow: 0 6px 14px rgba(35, 77, 28, 0.25);
    }

    .card.flipped,
    .card.matched {
      transform: rotateY(180deg);
      cursor: default;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: var(--card-radius);
      backface-visibility: hidden;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.55);
    }

    .front {
      transform: rotateY(180deg);
      background: #ffffff;
    }

    .front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .back {
      background-image: url("images/card.jpg");
      background-size: cover;
      background-position: center;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .restart {
      border: none;
      background: linear-gradient(180deg, #90d874, #5cad44);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.02em;
      border-radius: 12px;
      padding: 10px 24px;
      cursor: pointer;
      box-shadow: 0 4px 0 #3e7f2f;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    .restart:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .restart:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #3e7f2f;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(23, 42, 15, 0.6);
      z-index: 10;
      padding: 18px;
      overflow: hidden;
    }

    .overlay.show {
      display: flex;
    }

    .overlay-box {
      position: relative;
      z-index: 2;
      width: min(620px, 94vw);
      background: linear-gradient(180deg, #fffef6, #f0fbe6);
      border: 2px solid #e2f1d1;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.24);
      padding: 28px 22px;
      text-align: center;
      animation: pop 0.28s ease-out;
    }

    .overlay-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 10px;
      color: #3a6f2d;
    }

    .overlay-text {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #4b6e33;
    }

    .result-poster {
      width: min(330px, 78vw);
      aspect-ratio: 4 / 3;
      margin: 10px auto 14px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 25px rgba(56, 84, 40, 0.25);
      background: #fff;
    }

    .result-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .result-stats {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 10px;
      color: #365f28;
      font-weight: 700;
    }

    .result-encourage {
      margin: 0 auto 20px;
      max-width: 500px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #4b6e33;
    }

    .fireworks-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .app {
        width: min(100%, 96vw);
        margin: 14px auto 22px;
      }

      .top-panel {
        padding: 14px 12px;
      }

      .title {
        font-size: 1.25rem;
      }

      .board-wrap {
        padding: 8px;
      }

      .board {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .card {
        width: 100%;
        max-width: 70px;
        justify-self: center;
      }

      .controls {
        margin-top: 12px;
      }

      .restart {
        width: 88%;
      }
    }

    @keyframes pop {
      from {
        transform: scale(0.92);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top-panel">
      <h1 class="title">🌿 皮克敏對對碰</h1>
      <div class="stats">
        <span class="badge">配對次數：<span id="matchCount">0</span> / 8</span>
        <span class="badge">通關計時：<span id="timerText">0 秒</span></span>
        <button class="sound-toggle" id="soundToggleBtn" type="button" aria-pressed="false">🔊 開聲</button>
      </div>
      <p class="hint">翻開兩張相同皮克敏即可配對成功，全部找齊就完成收集！</p>
    </section>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="4x4 皮克敏對對碰棋盤"></div>
    </section>

    <div class="controls">
      <button class="restart" id="restartBtn" type="button">重新開始</button>
    </div>
  </main>

  <section class="overlay" id="overlay" aria-modal="true" role="dialog">
    <canvas class="fireworks-canvas" id="fireworksCanvas"></canvas>
    <div class="overlay-box">
      <h2 class="overlay-title">🎉 恭喜！皮克敏順利收集完畢！🎉</h2>
      <p class="overlay-text">全員集合，合作精神滿分！</p>
      <div class="result-poster">
        <img src="images/All Pikmins images.png" alt="皮克敏全家福" />
      </div>
      <div class="result-stats">
        <div id="finalTime">本次通關時間：0 秒</div>
        <div id="finalMatchCount">配對次數：0</div>
      </div>
      <p class="result-encourage">真是不容易，但是你成功了！</p>
      <button class="restart" id="overlayRestartBtn" type="button">重新開始</button>
    </div>
  </section>

  <script>
    /*
     * 皮克敏對對碰（純輕鬆收集模式）
     * - 4x4 網格，共 16 張卡（8 對）
     * - 皆使用 images/ 資料夾中的圖片
     * - 配對成功後卡片保持翻開
     * - 完成 8 對後顯示全螢幕慶祝視窗
     */

    // 8 種皮克敏圖片設定（依指定檔名）
    const PIKMIN = [
      { id: "red", image: "images/red.png" },
      { id: "yellow", image: "images/yellow.png" },
      { id: "blue", image: "images/blue.png" },
      { id: "purple", image: "images/purple.png" },
      { id: "white", image: "images/white.png" },
      { id: "rock", image: "images/rock.png" },
      { id: "pinkwing", image: "images/pinkwing.png" },
      { id: "iceblue", image: "images/iceblue.png" }
    ];

    const CARD_BACK_IMAGE = "images/card.jpg";
    const ALL_PIKMINS_IMAGE = "images/All Pikmins images.png";
    const TOTAL_PAIRS = 8;

    const preloadList = [
      ...PIKMIN.map((p) => p.image),
      CARD_BACK_IMAGE,
      ALL_PIKMINS_IMAGE
    ];

    // 預先載入所有遊戲圖片，降低首次翻牌延遲
    function preloadImages(urls) {
      return Promise.all(
        urls.map(
          (url) =>
            new Promise((resolve) => {
              const img = new Image();
              img.onload = resolve;
              img.onerror = resolve;
              img.src = url;
            })
        )
      );
    }

    const boardEl = document.getElementById("board");
    const matchCountEl = document.getElementById("matchCount");
    const timerTextEl = document.getElementById("timerText");
    const soundToggleBtn = document.getElementById("soundToggleBtn");
    const restartBtn = document.getElementById("restartBtn");
    const overlay = document.getElementById("overlay");
    const overlayRestartBtn = document.getElementById("overlayRestartBtn");
    const finalTimeEl = document.getElementById("finalTime");
    const finalMatchCountEl = document.getElementById("finalMatchCount");
    const fireworksCanvas = document.getElementById("fireworksCanvas");

    let deck = [];
    let opened = [];
    let lockBoard = false;
    let matchedPairs = 0;
    let gameStartedAt = 0;
    let timerIntervalId = null;
    let elapsedSeconds = 0;
    let isMuted = false;
    let audioCtx = null;
    let fireworksRafId = null;
    let fireworksParticles = [];

    // 輕量音效：使用 Web Audio API 產生翻牌、成功與通關提示音
    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    }

    function playTone(freq, duration, type = "sine", volume = 0.03, startDelay = 0) {
      if (!audioCtx || isMuted) return;
      const now = audioCtx.currentTime + startDelay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playFlipSound() {
      playTone(680, 0.08, "triangle", 0.02);
    }

    function playMatchSound() {
      playTone(660, 0.09, "sine", 0.03);
      playTone(990, 0.14, "sine", 0.03, 0.08);
    }

    function playWinSound() {
      playTone(523, 0.14, "triangle", 0.04);
      playTone(659, 0.14, "triangle", 0.04, 0.12);
      playTone(784, 0.18, "triangle", 0.045, 0.24);
      playTone(1046, 0.24, "triangle", 0.05, 0.38);
    }

    function updateSoundToggleUI() {
      soundToggleBtn.textContent = isMuted ? "🔇 靜音" : "🔊 開聲";
      soundToggleBtn.classList.toggle("is-muted", isMuted);
      soundToggleBtn.setAttribute("aria-pressed", String(isMuted));
    }

    function launchFireworkBurst(x, y) {
      const colors = ["#ffd54f", "#ff8a65", "#ffecb3", "#81c784", "#90caf9", "#f48fb1"];
      const amount = 24;
      for (let i = 0; i < amount; i++) {
        const angle = (Math.PI * 2 * i) / amount;
        const speed = 1.6 + Math.random() * 2.4;
        fireworksParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 40 + Math.random() * 30,
          size: 2 + Math.random() * 3,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function startFireworks() {
      stopFireworks();
      const ctx = fireworksCanvas.getContext("2d");
      if (!ctx) return;

      const resizeCanvas = () => {
        fireworksCanvas.width = overlay.clientWidth;
        fireworksCanvas.height = overlay.clientHeight;
      };
      resizeCanvas();

      let frameCount = 0;
      const animate = () => {
        frameCount += 1;
        ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

        if (frameCount % 16 === 0) {
          const x = 60 + Math.random() * (fireworksCanvas.width - 120);
          const y = 70 + Math.random() * (fireworksCanvas.height * 0.45);
          launchFireworkBurst(x, y);
        }

        fireworksParticles = fireworksParticles.filter((p) => p.life > 0);
        fireworksParticles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.03;
          p.vx *= 0.995;
          p.life -= 1;
          const alpha = Math.max(0, p.life / 70);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        fireworksRafId = requestAnimationFrame(animate);
      };
      fireworksRafId = requestAnimationFrame(animate);
      window.addEventListener("resize", resizeCanvas, { passive: true });
      fireworksCanvas._resizeCanvasHandler = resizeCanvas;
    }

    function stopFireworks() {
      if (fireworksRafId) {
        cancelAnimationFrame(fireworksRafId);
        fireworksRafId = null;
      }
      const handler = fireworksCanvas._resizeCanvasHandler;
      if (handler) {
        window.removeEventListener("resize", handler);
        fireworksCanvas._resizeCanvasHandler = null;
      }
      const ctx = fireworksCanvas.getContext("2d");
      if (ctx) ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      fireworksParticles = [];
    }

    // Fisher-Yates 洗牌
    function shuffle(arr) {
      const list = [...arr];
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    // 產生 16 張卡片資料（每個 id 各兩張）
    function createDeck() {
      const duplicated = [];
      PIKMIN.forEach((p) => {
        duplicated.push({ key: p.id, image: p.image });
        duplicated.push({ key: p.id, image: p.image });
      });
      return shuffle(duplicated);
    }

    // 建立棋盤 DOM
    function renderBoard() {
      boardEl.innerHTML = "";
      deck.forEach((card, index) => {
        const cardEl = document.createElement("button");
        cardEl.type = "button";
        cardEl.className = "card";
        cardEl.dataset.index = String(index);
        cardEl.setAttribute("aria-label", "對對碰卡片");

        const back = document.createElement("div");
        back.className = "face back";

        const front = document.createElement("div");
        front.className = "face front";
        const img = document.createElement("img");
        img.src = card.image;
        img.alt = card.key;
        front.appendChild(img);

        cardEl.appendChild(back);
        cardEl.appendChild(front);

        cardEl.addEventListener("click", () => onCardClick(index));
        boardEl.appendChild(cardEl);
      });
    }

    function updateStats() {
      matchCountEl.textContent = String(matchedPairs);
      timerTextEl.textContent = formatDuration(elapsedSeconds);
    }

    function formatDuration(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      if (mins <= 0) return `${secs} 秒`;
      return `${mins} 分 ${secs} 秒`;
    }

    function startTimer() {
      stopTimer();
      gameStartedAt = Date.now();
      elapsedSeconds = 0;
      updateStats();
      timerIntervalId = setInterval(() => {
        elapsedSeconds = Math.floor((Date.now() - gameStartedAt) / 1000);
        timerTextEl.textContent = formatDuration(elapsedSeconds);
      }, 250);
    }

    function stopTimer() {
      if (timerIntervalId) {
        clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
    }

    function showOverlay() {
      overlay.classList.add("show");
      startFireworks();
      playWinSound();
    }

    function hideOverlay() {
      overlay.classList.remove("show");
      stopFireworks();
    }

    function onCardClick(index) {
      if (lockBoard) return;

      const cardEl = boardEl.children[index];
      if (!cardEl) return;

      // 已配對或已翻開的卡片不可再操作
      if (cardEl.classList.contains("matched") || cardEl.classList.contains("flipped")) return;

      ensureAudioContext();
      playFlipSound();
      cardEl.classList.add("flipped");
      opened.push(index);

      // 只有翻開 2 張時才進行比對
      if (opened.length < 2) return;

      lockBoard = true;
      const [a, b] = opened;
      const isMatch = deck[a].key === deck[b].key;

      if (isMatch) {
        playMatchSound();
        boardEl.children[a].classList.add("matched");
        boardEl.children[b].classList.add("matched");
        matchedPairs += 1;
        updateStats();
        opened = [];
        lockBoard = false;

        // 8 對都完成時顯示慶祝視窗
        if (matchedPairs === TOTAL_PAIRS) {
          stopTimer();
          finalTimeEl.textContent = `本次通關時間：${formatDuration(elapsedSeconds)}`;
          finalMatchCountEl.textContent = `配對次數：${matchedPairs} / ${TOTAL_PAIRS}`;
          showOverlay();
        }
        return;
      }

      // 配對失敗：延遲後翻回去，保留流暢視覺
      setTimeout(() => {
        boardEl.children[a].classList.remove("flipped");
        boardEl.children[b].classList.remove("flipped");
        opened = [];
        lockBoard = false;
      }, 700);
    }

    // 重開一局
    function startGame() {
      hideOverlay();
      deck = createDeck();
      opened = [];
      lockBoard = false;
      matchedPairs = 0;
      elapsedSeconds = 0;
      updateStats();
      renderBoard();
      startTimer();
    }

    restartBtn.addEventListener("click", startGame);
    overlayRestartBtn.addEventListener("click", startGame);
    soundToggleBtn.addEventListener("click", () => {
      ensureAudioContext();
      isMuted = !isMuted;
      updateSoundToggleUI();
    });

    // 初次載入：先預載，後開局
    preloadImages(preloadList).finally(() => {
      updateSoundToggleUI();
      startGame();
    });
  </script>
</body>
</html>
